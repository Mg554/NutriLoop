# Builds the NutriLoop Android APK on every push to main and on version tags.
# - runs the unit tests first
# - signs the APK when the signing secrets exist (NL_KEYSTORE_BASE64 ...)
# - tag vX.Y.Z  ->  GitHub Release with the signed APK attached
name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 1.0.0 (empty = test build, no release)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build web app for Android
        run: npm run build:native

      - name: Copy web app into the Android project
        run: npx cap sync android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Restore signing key
        env:
          KS: ${{ secrets.NL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "NL_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets: building an unsigned release APK"
          fi

      - name: Version
        run: |
          echo "NL_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          if [ -n "${{ inputs.version }}" ]; then
            echo "NL_VERSION_NAME=${{ inputs.version }}" >> "$GITHUB_ENV"
            echo "NL_RELEASE=v${{ inputs.version }}" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "NL_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "NL_RELEASE=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "NL_VERSION_NAME=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        working-directory: android
        env:
          NL_KEYSTORE_PASSWORD: ${{ secrets.NL_KEYSTORE_PASSWORD }}
          NL_KEY_PASSWORD: ${{ secrets.NL_KEY_PASSWORD }}
          NL_KEY_ALIAS: ${{ secrets.NL_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          ls -la app/build/outputs/apk/release/

      - name: Name the APK
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" "NutriLoop-${NL_VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v6
        with:
          name: NutriLoop-${{ env.NL_VERSION_NAME }}
          path: NutriLoop-*.apk
          retention-days: 30

      # a release needs a SIGNED apk: refuse to publish an unsigned one
      - name: Check signature before release
        if: env.NL_RELEASE != ''
        run: |
          if [ -z "$NL_KEYSTORE_FILE" ]; then echo "::error::Signing secrets missing - not releasing an unsigned APK"; exit 1; fi
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs NutriLoop-*.apk | head -3

      # tag push (vX.Y.Z) or manual run with a version -> GitHub Release (+ tag)
      - name: Release
        if: env.NL_RELEASE != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NL_RELEASE }}
          target_commitish: ${{ github.sha }}
          name: NutriLoop ${{ env.NL_VERSION_NAME }}
          files: NutriLoop-*.apk
          generate_release_notes: true
