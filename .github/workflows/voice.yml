# Generates the recorded Arabic voice clips and commits them.
#   ElevenLabs when the ELEVENLABS_API_KEY / ELEVENLABS_VOICE_ID secrets exist,
#   otherwise Piper (open-source, ar_JO-kareem-medium).
# Run by hand: Actions -> Voice clips -> mode "samples" (a few lines to listen to,
# committed to voice-samples/) or "full" (all phrases -> public/voice/).
# Also runs on push when the spoken phrases change (full, incremental).
name: Voice clips

on:
  workflow_dispatch:
    inputs:
      mode:
        description: samples or full
        default: samples
        type: choice
        options: [samples, full]
      models:
        description: ElevenLabs model(s) for samples, comma separated
        default: eleven_multilingual_v2,eleven_v3
  push:
    branches: [main]
    paths:
      - src/data.js
      - src/modules/move/data.js
      - src/speechText.js
      - scripts/speech-lines.src.js
      - scripts/synth.py

permissions:
  contents: write
  actions: write   # to start the APK build after new clips land

concurrency:
  group: voice
  cancel-in-progress: false

env:
  ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
  ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
  MODE: ${{ inputs.mode || 'full' }}

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Collect phrases
        run: |
          node scripts/speech-lines.mjs
          node scripts/voice-manifest.mjs ids

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Tools
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          if [ -z "$ELEVENLABS_API_KEY" ]; then
            pip install --quiet piper-tts
            base=https://huggingface.co/rhasspy/piper-voices/resolve/main/ar/ar_JO/kareem/medium
            curl -sSLf -o ar.onnx      "$base/ar_JO-kareem-medium.onnx"
            curl -sSLf -o ar.onnx.json "$base/ar_JO-kareem-medium.onnx.json"
            echo "provider: Piper"
          else
            echo "provider: ElevenLabs"
          fi

      - name: Samples
        if: env.MODE == 'samples'
        env:
          VOICE_SAMPLES: '1'
          ELEVENLABS_MODELS: ${{ inputs.models }}
        run: |
          rm -rf voice-samples
          python scripts/synth.py voice-lines.json voice-samples ar.onnx

      - name: All clips
        if: env.MODE == 'full'
        run: |
          python scripts/synth.py voice-lines.json public/voice ar.onnx
          node scripts/voice-manifest.mjs

      - name: Commit
        run: |
          git config user.name  "nutriloop-bot"
          git config user.email "nutriloop-bot@users.noreply.github.com"
          if [ "$MODE" = samples ]; then git add -A voice-samples; MSG="voice: samples"; else git add -A public/voice src/voiceClips.js; MSG="voice: regenerate Arabic clips"; fi
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "$MSG"
          git pull --rebase -q origin main
          git push

      # pushes made with GITHUB_TOKEN don't trigger other workflows,
      # so start the APK/web build explicitly when real clips changed
      - name: Rebuild app with the new clips
        if: env.MODE == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git log -1 --pretty=%s | grep -q "^voice: regenerate"; then gh workflow run android.yml --ref main; fi
